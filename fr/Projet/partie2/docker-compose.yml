services:
  # Conteneur 1 : Acquisition de données
  acquisition:
    build: ./acquisition
    container_name: projet_acquisition
    volumes:
      - shared_data:/shared_data
    environment:
      - OUTPUT_DIR=/shared_data
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      # Tuning Spark (override possible via .env)
      - SPARK_PARALLELISM=${SPARK_PARALLELISM:-200}
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-2g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-2g}
    networks:
      - projet_network

  # Conteneur 2 : Analyse et Étiquetage
  analysis:
    build: ./analysis
    container_name: projet_analysis
    depends_on:
      acquisition:
        condition: service_completed_successfully
    volumes:
      - shared_data:/shared_data
    environment:
      - INPUT_DIR=/shared_data
      - OUTPUT_DIR=/shared_data
      # Tuning Spark (override possible via .env)
      - SPARK_PARALLELISM=${SPARK_PARALLELISM:-200}
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-2g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-2g}
    networks:
      - projet_network

  # Conteneur 3 : Visualisation (généré à partir des JSON d'analyse)
  visualization:
    build: ./visualization
    container_name: projet_visualization
    depends_on:
      analysis:
        condition: service_completed_successfully
    volumes:
      - shared_data:/shared_data
    environment:
      - INPUT_DIR=/shared_data
      - OUTPUT_DIR=/shared_data
    networks:
      - projet_network

  # Conteneur 4 : Recommandation
  recommendation:
    build: ./recommendation
    container_name: projet_recommendation
    depends_on:
      analysis:
        condition: service_completed_successfully
    volumes:
      - shared_data:/shared_data
    environment:
      - INPUT_DIR=/shared_data
      - OUTPUT_DIR=/shared_data
      # Tuning Spark + MLlib (override possible via .env)
      - SPARK_PARALLELISM=${SPARK_PARALLELISM:-200}
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-2g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-2g}
      - RF_NUM_TREES=${RF_NUM_TREES:-100}
      - RF_MAX_DEPTH=${RF_MAX_DEPTH:-10}
      - RF_MAX_BINS=${RF_MAX_BINS:-256}
    networks:
      - projet_network

# Volume partagé pour les données entre conteneurs
volumes:
  shared_data:
    driver: local

# Réseau pour la communication entre conteneurs
networks:
  projet_network:
    driver: bridge
